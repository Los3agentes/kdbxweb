name: Build KdbxWeb engine from forks
on:
  push:
    paths:
      - '.github/workflows/build-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools and forked dependencies
        run: |
          npm install --ignore-scripts --no-package-lock
          npm install --ignore-scripts --no-package-lock --no-save fflate@0.8.3 @xmldom/xmldom@0.9.12
      - name: Enable transpile-only for legacy TypeScript compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('conf/webpack.config.ts')
          s=p.read_text()
          s=s.replace("configFile: path.join(", "transpileOnly: true,\n                        configFile: path.join(")
          p.write_text(s)
          PY
      - name: Build browser distribution
        run: npm run pack:dist-prod
      - name: Verify distribution
        run: |
          test -s dist/kdbxweb.min.js
          ls -lh dist/kdbxweb.min.js
      - uses: actions/upload-artifact@v4
        with:
          name: kdbxweb-engine
          path: dist/kdbxweb.min.js
